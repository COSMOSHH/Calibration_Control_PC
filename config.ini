; 馈源相位校准软件外部配置。修改后请完全退出并重新启动软件。
; mode 可选 simulated/serial/visa/manual/auto，具体可选值见各项注释。

[device]
; STM32：simulated=模拟，serial=真实串口。
mode = simulated
serial_port = COM1
serial_baudrate = 9600

[spectrum_analyzer]
; mode：simulated 或 visa；profile：research 或 xian_gpib。
mode = simulated
profile = research
; visa_backend：auto=系统默认，ivi=厂商 VISA Runtime，py=软件内置 pyvisa-py。
; TCPIP SOCKET 可优先尝试 py；GPIB 通常使用 ivi 和厂商驱动。
visa_backend = auto
visa_address = TCPIP0::10.18.18.4::5025::SOCKET
xian_gpib_address = GPIB0::20::INSTR
timeout_ms = 5000
span_ghz = 0.002
scan_points = 201
rbw_hz = 1000
vbw_hz = 1000
frequency_divisor = 10.0

[signal_source]
; manual=仅显示参数并手动控制仪器，auto=由软件通过 VISA 控制。
mode = manual
lo_visa_address = TCPIP0::10.18.18.4::hislip0::INSTR
if_visa_address = TCPIP0::10.18.18.3::hislip0::INSTR
timeout_ms = 5000

[turntable]
mode = simulated
serial_port = COM1
baudrate = 38400
slave_id = 1
pulses_per_degree = 2000.0
move_timeout_s = 30.0
poll_interval_s = 0.05
settle_time_s = 0.12

[calibration]
frequency_ghz = 212.0
beam_angle_deg = 30.0
phase_start_deg = 0.0
phase_end_deg = 354.375
phase_step_deg = 5.625
default_amplitude = 0.12
settle_time_ms = 500
sample_count = 3

[paths]
; 相对路径以 config.ini 所在目录为基准，也可以填写绝对路径。
output_dir = output
