[project]
name = "thz-feed-calibration"
version = "0.1.0"
description = "Four-feed THz phase calibration upper-computer application."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "pyserial>=3.5",
    "pymodbus>=3.8",
    "pyvisa>=1.14",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
